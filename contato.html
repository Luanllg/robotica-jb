<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Projeto de Robótica da Escola Estadual José Bonifácio: projetos dos alunos, eventos e contato.">

<body data-page="contato"><a class="skip" href="#conteudo">Ir para o conteúdo</a>
<header id="topo"></header>
<main id="conteudo" tabindex="-1"><section class="page-head"><div class="wrap"><h1>Contato e localização</h1><p>Dúvidas, convites para eventos ou vontade de conhecer o laboratório? Escreva para a equipe ou venha nos visitar.</p></div></section>
<div class="wrap"><section class="contato">
<form id="form" class="painel"><h2>Envie uma mensagem</h2>
<label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required>
<label for="email">E-mail para resposta</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="msg">Mensagem</label><textarea id="msg" name="mensagem" rows="6" required></textarea>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<p><button class="btn" type="submit">Enviar mensagem</button></p><p id="st" role="status"></p></form>
<div class="lado"><div class="painel"><h2>Onde estamos</h2>
<iframe id="mapa" title="Mapa com a localização da Escola Estadual José Bonifácio" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
<address><strong>Escola Estadual José Bonifácio</strong><br><span id="end"></span></address>
<a class="btn" id="rota" href="https://www.google.com/maps" target="_blank" rel="noopener">Como chegar</a></div>
<div class="painel"><h2>Outros contatos</h2><p>Direção da escola:<br><a id="mail" href="mailto:erivelton.ramos@educacao.mg.gov.br"></a></p></div></div></section></div></main>
